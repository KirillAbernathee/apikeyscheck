<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Баланс Agent Router — остаток по API-ключу</title>
<meta name="description" id="metaDesc" content="Статическая страница: показывает остаток на API-ключе Agent Router и траты по дням и часам.">
<style>
:root{
  --bg:#0d121c;
  --panel:#131a27;
  --panel-2:#182131;
  --line:#233049;
  --line-soft:#1b2434;
  --text:#e8ecf4;
  --muted:#8a97ae;
  --dim:#5b6981;
  --amber:#f0b45f;
  --amber-deep:#a4712c;
  --copper:#d98756;
  --cyan:#6fd0d6;
  --red:#e2686c;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(1100px 620px at 12% -12%,#17223a 0%,rgba(23,34,58,0) 68%);
  color:var(--text);
  font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  padding:0 0 56px;
}
a{color:var(--amber);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}

.wrap{max-width:1000px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:30px 0 20px}
.brand{
  font:600 13px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;
  color:var(--text);
}
.brand span{color:var(--amber)}
.brand i{font-style:normal;color:var(--dim)}
.top .sub{color:var(--dim);font-size:13px}
.top .sub a{color:var(--dim);border-bottom:1px dotted var(--line);text-decoration:none}
.top .sub a:hover{color:var(--muted);text-decoration:none}
.top__link{
  margin-left:auto;white-space:nowrap;
  color:var(--amber);font-size:13px;text-decoration:none;
  padding:7px 13px;border:1px solid var(--amber-deep);border-radius:999px;
}
.top__link:hover{background:rgba(240,180,95,.1);text-decoration:none}
/* Переключатель языка: тот же вид, что у кнопок периода, только мельче. */
.lang{align-self:center;flex:0 0 auto}
.lang button{padding:6px 11px;font:600 11px/1 var(--mono);letter-spacing:.1em}

/* ---------- выбор языка при входе ---------- */
.langgate{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(10,11,13,.86);backdrop-filter:blur(3px);
}
.langgate.hidden{display:none}
.langgate__box{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:30px 34px;text-align:center;max-width:400px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.langgate__title{color:var(--text);font-size:15px;line-height:1.5;margin-bottom:20px}
.langgate__btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.langgate__btn{min-width:130px}

/* ---------- cards ---------- */
.card{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:var(--r);
  margin-bottom:14px;
}
.card__head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--line-soft);
}
.card__title{
  font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  margin:0;
}
.card__body{padding:18px}

/* ---------- key form ---------- */
.keyform{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 18px}
.field{position:relative;flex:1 1 320px;min-width:0}
.field input{
  width:100%;height:44px;padding:0 76px 0 14px;
  background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:8px;
  font:14px/1 var(--mono);letter-spacing:.02em;
}
.field input::placeholder{color:var(--dim);letter-spacing:.1em}
.field input:focus{border-color:var(--amber-deep);outline:none}
.reveal{
  position:absolute;right:6px;top:6px;height:32px;padding:0 10px;
  background:transparent;color:var(--dim);border:1px solid transparent;border-radius:6px;
  font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
}
.reveal:hover{color:var(--text);border-color:var(--line)}
.btn{
  height:44px;padding:0 22px;cursor:pointer;
  background:var(--amber);color:#20160a;border:1px solid var(--amber);border-radius:8px;
  font:600 13px/1 var(--sans);letter-spacing:.02em;
}
.btn:hover{background:#ffc470}
.btn[disabled]{opacity:.5;cursor:default}
.btn--ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn--ghost:hover{background:var(--panel-2);color:var(--text)}
.remember{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.remember input{accent-color:var(--amber);width:15px;height:15px}

.msg{margin:0 18px 16px;padding:11px 14px;border-radius:8px;font-size:13.5px;line-height:1.5}
.msg--err{background:rgba(226,104,108,.09);border:1px solid rgba(226,104,108,.35);color:#f5b7b9}
.msg--warn{background:rgba(240,180,95,.08);border:1px solid rgba(240,180,95,.3);color:#f2cd97}
.msg--ok{background:rgba(111,208,214,.07);border:1px solid rgba(111,208,214,.28);color:#a9e4e8}
.msg b{color:#fff}
.hidden{display:none !important}

/* ---------- settings ---------- */
details.opts{border-top:1px solid var(--line-soft)}
details.opts summary{
  padding:11px 18px;cursor:pointer;color:var(--dim);
  font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  list-style:none;
}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary::before{content:"+ ";color:var(--line)}
details.opts[open] summary::before{content:"− "}
details.opts summary:hover{color:var(--muted)}
.opts__body{padding:4px 18px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.opt{display:flex;flex-direction:column;gap:6px;flex:1 1 260px}
.opt label{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.opt input,.opt select{
  height:36px;padding:0 10px;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:7px;font:13px/1 var(--mono);
}
.opt small{color:var(--dim);font-size:11.5px;line-height:1.4}

/* ---------- gauge ---------- */
.gauge{padding:22px 18px 18px}
.gauge__label{font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.gauge__row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:10px 0 18px}
.gauge__num{
  font:600 clamp(38px,8vw,62px)/.95 var(--mono);letter-spacing:-.02em;
  color:var(--amber);font-variant-numeric:tabular-nums;
}
.gauge__num.is-low{color:var(--red)}
.gauge__num.is-idle{color:var(--dim)}
.gauge__of{color:var(--muted);font-size:13.5px;padding-bottom:8px}
.gauge__of b{color:var(--text);font-family:var(--mono);font-weight:500}
.meter{position:relative}
.segs{display:flex;gap:3px;height:34px}
.seg{flex:1 1 0;border-radius:2px;background:var(--line-soft);transition:background .2s}
.seg.on{background:linear-gradient(180deg,var(--amber),var(--amber-deep))}
.seg.on.low{background:linear-gradient(180deg,var(--red),#8e3336)}
.seg.fill{animation:rise .3s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--i)*7ms)}
@keyframes rise{from{opacity:0;transform:scaleY(.25)}to{opacity:1;transform:none}}
.ticks{display:flex;margin-top:7px;font:10px/1 var(--mono);color:var(--dim);letter-spacing:.08em}
.ticks span{flex:1 1 0}
.ticks span+span{text-align:center}
.ticks span:last-child{text-align:right}
.grant{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:12.5px}
.grant label{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.grant__cur{font:400 13px/1 var(--mono);color:var(--dim);margin-left:2px}
.grant input{
  width:92px;height:29px;padding:0 8px;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:7px;
  font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums;
}
.grant input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.grant small{flex:1 1 240px;color:var(--dim);font-size:11.5px;line-height:1.4}
.btn--sm{height:31px;padding:0 13px;font-size:12px;border-radius:7px}
.exact{flex:1 1 100%;margin-top:2px}
.exact>summary{
  display:inline-block;cursor:pointer;list-style:none;
  color:var(--dim);font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  border-bottom:1px dotted var(--line);padding-bottom:3px;
}
.exact>summary::-webkit-details-marker{display:none}
.exact>summary:hover{color:var(--muted)}
.exact[open]>summary{color:var(--muted);margin-bottom:11px}
.exact__body{
  background:var(--bg);border:1px solid var(--line-soft);border-radius:9px;
  padding:13px 14px;max-width:620px;
}
.exact__body p{margin:0 0 11px;color:var(--muted);font-size:12.5px;line-height:1.55}
.exact__body p b{color:var(--text);font-family:var(--mono);font-weight:500}
.exact__row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.exact__row input{
  flex:1 1 240px;min-width:0;height:31px;padding:0 10px;
  background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:7px;
  font:12.5px/1 var(--mono);
}
.exact__row input:focus{border-color:var(--amber-deep);outline:none}
.exact__body>small{display:block;margin-top:10px;color:var(--dim);font-size:11.5px;line-height:1.45}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border-top:1px solid var(--line-soft)}
.stat{background:var(--panel);padding:15px 18px}
.stat dt{font:600 10px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 7px}
.stat dd{margin:0;font:500 21px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat dd small{display:block;margin-top:5px;font:400 11.5px/1.3 var(--sans);color:var(--dim);font-variant-numeric:normal}
.stat--accent dd{color:var(--cyan)}

/* ---------- controls ---------- */
.seg-ctl{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg-ctl button{
  padding:7px 12px;background:transparent;color:var(--muted);border:0;cursor:pointer;
  font:12px/1 var(--sans);
}
.seg-ctl button+button{border-left:1px solid var(--line)}
.seg-ctl button:hover{background:var(--panel-2);color:var(--text)}
.seg-ctl button[aria-pressed="true"]{background:var(--panel-2);color:var(--amber);font-weight:600}
select.pick{
  height:31px;padding:0 8px;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:7px;font:12px/1 var(--sans);max-width:210px;
}
.spacer{margin-left:auto}
.custom{display:flex;gap:8px;align-items:center;padding:0 18px 14px;color:var(--dim);font-size:12px}
.tznote{padding:0 18px 14px;color:var(--dim);font-size:11.5px;line-height:1.45}
.custom input{
  height:31px;padding:0 8px;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:7px;font:12px/1 var(--mono);
}

/* ---------- chart ---------- */
.chart{position:relative;padding:18px 18px 0}
.chart__grid{position:relative;height:190px;border-bottom:1px solid var(--line)}
.gridline{position:absolute;left:56px;right:0;border-top:1px dashed var(--line-soft);z-index:0}
.gridline span{position:absolute;right:100%;top:-6px;padding-right:9px;white-space:nowrap;color:var(--dim);font:10px/1 var(--mono)}
.bars{position:absolute;top:0;right:0;bottom:0;left:56px;z-index:1;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:hidden}
.bar{flex:1 0 4px;min-width:4px;height:100%;display:flex;align-items:flex-end;cursor:crosshair}
.bar i{display:block;width:100%;background:var(--copper);border-radius:2px 2px 0 0;min-height:0;transition:background .15s}
.bar.zero i{background:var(--line-soft);height:2px !important;min-height:2px}
.bar:hover i{background:var(--amber)}
.bar.peak i{background:linear-gradient(180deg,var(--amber),var(--copper))}
.xaxis{display:flex;justify-content:space-between;padding:8px 0 16px 56px;font:10px/1 var(--mono);color:var(--dim);letter-spacing:.06em}
.tip{
  position:absolute;pointer-events:none;z-index:5;transform:translate(-50%,-100%);
  background:#0a0e16;border:1px solid var(--line);border-radius:7px;padding:8px 11px;
  font:12px/1.5 var(--mono);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.tip b{color:var(--amber);font-weight:600}
.tip em{display:block;font-style:normal;color:var(--dim);font-size:11px}

/* ---------- table ---------- */
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:9px 18px;color:var(--dim);border-bottom:1px solid var(--line-soft);
  font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;
}
td{padding:9px 18px;border-bottom:1px solid var(--line-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.model{font-family:var(--mono);color:var(--cyan);font-size:12.5px}
td.time{color:var(--muted);font-family:var(--mono);font-size:12.5px}
.empty{padding:34px 18px;text-align:center;color:var(--dim);font-size:13.5px}
.more{padding:11px 18px;color:var(--dim);font-size:12px;border-top:1px solid var(--line-soft)}

/* ---------- инструкции ---------- */
.card--wide{border-color:var(--line)}
.card--wide .card__title{color:var(--amber)}
.card__note{color:var(--dim);font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.cheat{padding:15px 18px;border-bottom:1px solid var(--line-soft);background:rgba(240,180,95,.035)}
.cheat p{margin:0 0 7px;color:var(--muted);font-size:13px;line-height:1.55}
.cheat p:last-child{margin-bottom:0}
.cheat b{color:var(--text);font-weight:600}
.cheat u{text-decoration:none;color:var(--amber);border-bottom:1px solid var(--amber-deep)}
code{
  font:12.5px/1.45 var(--mono);color:#ecdcc2;
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:5px;padding:1px 5px;
}
.picker{padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.pgroup{margin-bottom:13px}
.pgroup:last-child{margin-bottom:0}
.pgroup__t{font:600 10px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 14px;cursor:pointer;
  background:var(--panel-2);color:var(--muted);
  border:1px solid var(--line);border-radius:999px;
  font:13px/1 var(--sans);
}
.chip:hover{color:var(--text);border-color:var(--muted)}
.chip.is-on{background:var(--amber);border-color:var(--amber);color:#1d1408;font-weight:600}
.guide{padding:18px}
.guide__name{margin:0 0 4px;font:600 19px/1.25 var(--sans);color:var(--text)}
.guide__name span{font:400 12.5px/1 var(--mono);color:var(--dim);letter-spacing:.03em}
.guide__hint{margin:0 0 14px;color:var(--cyan);font-size:12.5px}
.ways{display:grid;gap:8px;margin:12px 0 16px}
.way{
  display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;
  padding:10px 13px;background:var(--bg);border:1px solid var(--line-soft);border-radius:9px;
}
.way__proto{font:600 10.5px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--cyan)}
.way__base{font:12.5px/1.4 var(--mono);color:var(--text)}
.way__models{margin-left:auto;color:var(--dim);font-size:12px}
.gsteps{margin:0 0 15px;padding-left:23px;color:var(--muted);font-size:13.5px;line-height:1.65}
.gsteps li{margin-bottom:7px}
.gsteps li::marker{color:var(--amber-deep);font-family:var(--mono);font-size:12px}
.gsteps b{color:var(--text);font-weight:600}
.snip{margin-bottom:11px;background:var(--bg);border:1px solid var(--line-soft);border-radius:9px;overflow:hidden}
.snip__head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line-soft)}
.snip__head span{font:600 10px/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.copy{
  margin-left:auto;padding:4px 10px;cursor:pointer;
  background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:6px;
  font:10px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
}
.copy:hover{color:var(--text);border-color:var(--muted)}
.copy.is-done{color:var(--amber);border-color:var(--amber-deep)}
.snip pre{margin:0;padding:12px 13px;overflow-x:auto}
.snip pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.6;white-space:pre;color:#e4dbcc}
.gnote{
  margin-top:10px;padding:10px 13px;
  border-left:2px solid var(--amber-deep);border-radius:0 8px 8px 0;
  background:rgba(240,180,95,.05);color:var(--muted);font-size:12.5px;line-height:1.55;
}
.gnote b{color:var(--text);font-weight:600}

/* ---------- footer ---------- */
.foot{color:var(--dim);font-size:12.5px;line-height:1.65;padding:8px 2px}
.foot b{color:var(--muted);font-weight:600}

.skeleton{color:var(--dim)}
@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .wrap{padding:0 14px}
  .card__body,.gauge,.chart{padding-left:14px;padding-right:14px}
  .keyform{padding:14px}
  .stat{padding:13px 14px}
  th,td{padding:8px 14px}
  .btn{flex:1 1 auto}
  .cheat,.picker,.guide{padding-left:14px;padding-right:14px}
  .way__models{margin-left:0;flex:1 1 100%}
  .top__link{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand" id="brand">SAPHIROFF<span>·</span>KIRILLABERNATHEE <i id="brandTail"></i></div>
    <div class="sub" id="brandSub"></div>
    <a class="top__link" id="topLink" href="#guides"></a>
    <div class="seg-ctl lang" id="langCtl" role="group">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <!-- ключ -->
  <section class="card">
    <form class="keyform" id="form" autocomplete="off">
      <div class="field">
        <input id="key" type="password" placeholder="sk-..." spellcheck="false" autocomplete="off">
        <button type="button" class="reveal" id="reveal"></button>
      </div>
      <button class="btn" id="submit" type="submit"></button>
      <button class="btn btn--ghost hidden" id="forget" type="button"></button>
      <label class="remember"><input type="checkbox" id="remember"> <span id="rememberTxt"></span></label>
    </form>

    <div class="msg msg--err hidden" id="err"></div>
    <div class="msg msg--warn hidden" id="warn"></div>

    <details class="opts">
      <summary id="optsSummary"></summary>
      <div class="opts__body">
        <div class="opt">
          <label for="base" id="baseLbl"></label>
          <select id="base">
            <option value="https://agentrouter.org">https://agentrouter.org</option>
            <option value="https://ps.air-outer.com" id="baseMirror">https://ps.air-outer.com</option>
          </select>
        </div>
        <div class="opt">
          <label for="proxy" id="proxyLbl"></label>
          <input id="proxy" type="text" placeholder="https://proxy.example/{url}" spellcheck="false">
          <small id="proxyHint"></small>
        </div>
      </div>
    </details>
  </section>

  <!-- баланс -->
  <section class="card" id="balanceCard">
    <div class="gauge">
      <div class="gauge__label" id="gaugeLabel"></div>
      <div class="gauge__row">
        <div class="gauge__num is-idle" id="remain">$—</div>
        <div class="gauge__of" id="remainOf"></div>
      </div>
      <div class="meter">
        <div class="segs" id="segs" role="img"></div>
        <div class="ticks"><span>0%</span><span>50%</span><span>100%</span></div>
      </div>
      <div class="grant hidden" id="grantRow">

<script id="core">
/* Чистые функции: считают деньги и раскладывают логи по корзинам. Тестируются отдельно. */
(function (root) {
  'use strict';
  var C = {};
  var DAY = 86400000;

  C.DEFAULT_QUOTA_PER_UNIT = 500000;
  C.DEFAULT_GRANT = 175;
  /* Для ключа без собственного лимита сервис отдаёт метку-заглушку в сотню миллионов.
     Всё, что выше этого порога, балансом считать нельзя. */
  C.SENTINEL_USD = 1000000;
  C.isSaneLimit = function (v) { var n = Number(v); return isFinite(n) && n > 0 && n < C.SENTINEL_USD; };

  /* Кредиты на счёт приходят порциями по $25 за отметку на сайте, стартовая выдача — $175. */
  C.GRANT_STEP = 25;

  /* Точная картина счёта: остаток и потраченное приходят в единицах квоты. */
  C.accountFromSelf = function (payload, qpu) {
    var d = payload && payload.data ? payload.data : payload;
    if (!d || typeof d !== 'object') return null;
    var left = Number(d.quota), used = Number(d.used_quota);
    if (!isFinite(left) || !isFinite(used)) return null;
    var per = Number(qpu) > 0 ? Number(qpu) : C.DEFAULT_QUOTA_PER_UNIT;
    return { remain: left / per, spent: used / per, grant: (left + used) / per };
  };

  /* Пока точной суммы нет, выводим её из трат: выдача кратна шагу и не бывает меньше стартовой. */
  C.guessGrant = function (spent, step, base) {
    step = Number(step) > 0 ? Number(step) : C.GRANT_STEP;
    base = Number(base) > 0 ? Number(base) : C.DEFAULT_GRANT;

  /* ---------- язык ----------
     Заказчик просил спрашивать язык при каждом открытии, поэтому выбор намеренно
     не сохраняется: страница всегда стартует с окна выбора. Язык живёт только в памяти
     вкладки, а вся отрисовка идёт через T() — из-за этого смена языка на лету
     сводится к повторному вызову тех же функций отрисовки. */
  var LANG_DEFAULT = 'ru';
  var lang = LANG_DEFAULT;
  function L() { return window.ARI[lang] || window.ARI[LANG_DEFAULT]; }

  /* T('ключ', a, b) — строка словаря с подстановкой {0}, {1}.
     Незнакомый ключ возвращаем как есть: пустое место на странице заметить труднее,
     чем торчащее имя ключа, а тест на такие огрехи всё равно есть. */
  function T(key) {
    var d = L(), v = d[key];
    if (v == null) v = window.ARI[LANG_DEFAULT][key];
    if (v == null) return key;
    var args = Array.prototype.slice.call(arguments, 1);
    return fill(String(v), args);
  }
  function fill(s, args) {
    return s.replace(/\{(\d+)\}/g, function (m, i) {
      return args[Number(i)] === undefined ? m : String(args[Number(i)]);
    });
  }
  /* Формы слова: словарь сам знает, сколько их в языке и какую выбрать. */
  function TP(key, n) { return fill(L()._plural(n, L()[key]), [num(n)]); }

    st24: 'st24', st7: 'st7', streq: 'streq', stfc: 'stfc',
    guidesTitle: 'guidesTitle', cheat1: 'cheat1', cheat2: 'cheat2', cheat3: 'cheat3',
    chartTitle: 'chartTitle', granHour: 'granHour', granDay: 'granDay',
    r24h: 'r24h', r7d: 'r7d', r30d: 'r30d', rall: 'rall', rcustom: 'rcustom',
    dateFrom: 'dateFrom', dateTo: 'dateTo',
    pSumL: 'pSum', pReqL: 'pReq', pAvgL: 'pAvg', pPeakL: 'pPeak',
    tblTitle: 'tblTitle', thTime: 'thTime', thModel: 'thModel', thIn: 'thIn',
    thOut: 'thOut', thResp: 'thResp', thCost: 'thCost',
    tblEmpty: 'tblEmpty', foot: 'foot'
  };
  var RICH = { exactText: 1, cheat1: 1, cheat2: 1, cheat3: 1, foot: 1 };
  var ARIA = {
    key: 'keyAria', segs: 'meterAria', tok: 'tokAria', langCtl: 'switchLang',
    granCtl: 'granAria', rangeCtl: 'rangeAria', modelPick: 'modelAria'
  };

  /* Смена языка — это переписать разметку словарём и заново вызвать отрисовку. */
  function applyLang(l) {
    if (window.ARI[l]) lang = l;
    var d = L();

    if (document.documentElement) document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    var meta = $('metaDesc');
    if (meta) meta.setAttribute('content', d.metaDesc);

    Object.keys(STATIC).forEach(function (id) {
      var n = $(id); if (!n) return;
      if (RICH[id]) n.innerHTML = T(STATIC[id]); else n.textContent = T(STATIC[id]);
    });
    Object.keys(ARIA).forEach(function (id) {
      var n = $(id); if (n) n.setAttribute('aria-label', T(ARIA[id]));
    });

    var mir = $('baseMirror');
    if (mir) mir.textContent = (mir.value || 'https://ps.air-outer.com') + ' (' + T('optMirror') + ')';

    /* Эти две надписи зависят не только от языка, но и от того, что сейчас на экране. */
    var shown = $('key').type === 'text';
    $('reveal').textContent = T(shown ? 'hide' : 'reveal');
    $('reveal').setAttribute('aria-label', T(shown ? 'hideAria' : 'revealAria'));
    $('submit').textContent = state.loading ? T('submitBusy') : T('submit');
    press('langCtl', 'lang', lang);
    /* Подпись кнопки берём из словаря того языка, на который она переключает:
       «Русский» и «English» понятны при любом текущем языке страницы. */
    Array.prototype.forEach.call($('langCtl').children || [], function (b) {
      var t = window.ARI[b.dataset.lang];
      if (t) { b.setAttribute('aria-label', t.langName); b.setAttribute('title', t.langName); }
    });

    $('guidesCount').textContent = TP('guidesCount', tools().length);
    if (guideId) showGuide(guideId);
    else {
      showGuide(GUIDE_DEFAULT);
      /* Карточку могли переименовать или убрать — тогда открываем первую по списку,
         чтобы раздел не остался пустым. showGuide молча выходит, если id не найден. */
      if (!guideId) showGuide(guides().groups[0].tools[0].id);
    }

    /* Курс квоты стоит внутри строки подвала, поэтому возвращаем его после переписывания. */
    if ($('qpu')) $('qpu').textContent = num(state.qpu);

    /* Без данных пересчитывать нечего: возвращаем страницу к виду «ключ ещё не проверяли». */
    if (state.billing || state.logs.length) renderAll(); else resetView();
  }

  var state = {
    key: '', base: 'https://agentrouter.org', proxy: '',
    token: '',                 /* access token консоли — не обязателен, даёт точную сумму */
    qpu: C.DEFAULT_QUOTA_PER_UNIT,
    grant: C.DEFAULT_GRANT,
    grantManual: false,        /* сумму вписали руками — не затираем её оценкой */
    billing: null, account: null, logs: [], spend: [],
    range: '7d', gran: 'day', model: 'all',
    custom: { from: '', to: '' },
    loading: false
  };

  /* ---------- сеть ---------- */
  function buildUrl(path) {
    var target = state.base.replace(/\/+$/, '') + path;
    if (!state.proxy) return target;
    var p = state.proxy.trim();
    return p.indexOf('{url}') >= 0 ? p.replace('{url}', encodeURIComponent(target)) : p.replace(/\/+$/, '') + '/' + target;
  }

  function ApiError(message, status) { this.name = 'ApiError'; this.message = message; this.status = status; }
  ApiError.prototype = Object.create(Error.prototype);

  async function get(path, auth) {
    var headers = { 'Accept': 'application/json' };
    /* Ключ уходит по схеме Bearer, а токен консоли — голым значением: так устроен движок. */
    if (auth === 'access') headers['Authorization'] = state.token;
    else if (auth) headers['Authorization'] = 'Bearer ' + state.key;
    var res;
    try {
      res = await fetch(buildUrl(path), { headers: headers, cache: 'no-store', credentials: 'omit' });
    } catch (e) {
      throw new ApiError(T('errNoNet', hostLabel()), 0);
    }
    var text = await res.text();
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { /* не JSON — обработаем ниже */ }
    if (!res.ok) {
      var m = (data && data.error && data.error.message) || (data && data.message) || ('HTTP ' + res.status);
      throw new ApiError(C.cleanMessage(m, T), res.status);
    }
    if (data === null) throw new ApiError(T('errNotJson'), res.status);
    return data;
  }

  function hostLabel() {
    try { return new URL(state.base).host; } catch (e) { return state.base; }
  }

  /* Эндпоинт логов в разных сборках ведёт себя по-разному: одна отдаёт всю историю разом,
     другая режет на страницы своего размера и игнорирует наш page_size. Поэтому не гадаем
     по длине страницы, а листаем, пока приходят новые записи. */
  async function loadLogs() {
    var seen = {}, out = [], size = 200, total = null, pages = 0;
    for (var p = 1; p <= 60; p++) {
      var payload = await get('/api/log/token?key=' + encodeURIComponent(state.key) +
        '&p=' + p + '&page=' + p + '&page_size=' + size + '&pageSize=' + size +
        '&size=' + size + '&limit=' + size + '&offset=' + ((p - 1) * size), false);
      pages++;
      var meta = C.pageMeta(payload);
      if (meta.total != null) total = meta.total;
      var rows = C.normalizeLogs(payload, state.qpu);
      if (!rows.length) break;
      var added = 0;
      for (var i = 0; i < rows.length; i++) {
        if (!seen[rows[i].id]) { seen[rows[i].id] = 1; out.push(rows[i]); added++; }
      }
      if (!added) break;                                  /* пришло то же самое — страниц больше нет */
      if (total != null && out.length >= total) break;
    }
    out.sort(function (a, b) { return b.ts - a.ts; });
    return { logs: out, total: total, pages: pages };
  }

  async function loadBilling() {
    var today = new Date(), start = new Date(Date.now() - 400 * 86400000);
    var iso = function (d) { return d.toISOString().slice(0, 10); };
    var sub = await get('/v1/dashboard/billing/subscription', true);
    var use = await get('/dashboard/billing/usage?start_date=' + iso(start) + '&end_date=' + iso(today), true);
    var limit = Number(sub.hard_limit_usd);
    if (!C.isSaneLimit(limit)) limit = Number(sub.system_hard_limit_usd);
    var spent = (Number(use.total_usage) || 0) / 100;
    return {
      spent: spent,
      limit: C.isSaneLimit(limit) ? limit : null,   /* null = сервис лимита не сообщил */
      accessUntil: C.toMs(sub.access_until)
    };
  }

  /* Сколько всего выдано, знает не ключ, а счёт целиком: по ключу видны только его траты.
     Поэтому точную сумму читаем отдельным запросом, если человек добавил токен консоли.
     Разбираем ответ уже в check() — там будет известен точный курс квоты. */
  async function loadAccount() {
    if (!state.token) return null;
    return await get('/api/user/self', 'access');
  }

  /* ---------- основной сценарий ---------- */
  async function check() {
    if (state.loading) return;
    state.key = $('key').value.trim();
    if (!state.key) { showErr(T('errNoKey')); $('key').focus(); return; }
    if (!/^sk-/.test(state.key)) showWarn(T('warnPrefix'));
    else hide('warn');
    hide('err');

    setLoading(true);
    persist();
    refreshGuide();   /* ключ приняли — подставляем его в команды инструкций */

    var results = await Promise.allSettled([get('/api/status', false), loadBilling(), loadLogs(), loadAccount()]);
    var st = results[0], bl = results[1], lg = results[2], ac = results[3];

    if (st.status === 'fulfilled' && st.value && st.value.data && st.value.data.quota_per_unit) {
      state.qpu = Number(st.value.data.quota_per_unit) || state.qpu;
      $('qpu').textContent = num(state.qpu);
    }

    /* Ключ невалиден — дальше показывать нечего. */
    if (bl.status === 'rejected' && (bl.reason.status === 401 || bl.reason.status === 403)) {
      setLoading(false);
      showErr(T('errRejected', bl.reason.message));
      resetView();
      return;
    }
    if (lg.status === 'rejected' && bl.status === 'rejected') {
      setLoading(false);
      showErr(bl.reason.message);
      resetView();
      return;
    }

    state.billing = bl.status === 'fulfilled' ? bl.value : null;
    /* Пересчитываем в доллары по фактическому курсу квоты — /api/status мог его уточнить. */
    var box = lg.status === 'fulfilled' ? lg.value : { logs: [], total: null, pages: 0 };
    state.logs = box.logs;
    state.logsTotal = box.total;
    state.logs.forEach(function (l) { l.usd = l.quota / state.qpu; });
    state.spend = C.spendOnly(state.logs);

    var notes = [];
    if (bl.status === 'rejected') notes.push(T('noteBalance', bl.reason.message));
    if (lg.status === 'rejected') notes.push(T('noteLogs', lg.reason.message));

    /* Счёт разбираем здесь, а не в загрузчике: /api/status мог уточнить курс квоты. */
    state.account = null;
    if (state.token) {
      if (ac.status === 'fulfilled') {
        state.account = C.accountFromSelf(ac.value, state.qpu);
        if (!state.account) notes.push(T('noteTokParse'));
      } else {
        notes.push(T('noteTokBad', ac.reason.message));
      }
    }

    /* Сверка: сумма по истории должна сходиться с тем, что насчитал сервис.
       Если нет — часть запросов не попала в историю, и график занижает траты. */
    if (state.billing && lg.status === 'fulfilled' && state.spend.length) {
      var byLog = C.sum(state.spend), byService = state.billing.spent;
      if (byService > 0 && Math.abs(byService - byLog) > Math.max(0.02, byService * 0.005)) {
        notes.push(T('noteGap', C.usdSmart(byLog), C.usdSmart(byService)));
      }
    }
    if (notes.length) showWarn(notes.join('<br>')); else hide('warn');

    setLoading(false);
    renderAll();
  }

  function setLoading(on) {
    state.loading = on;
    $('submit').disabled = on;
    $('submit').textContent = on ? T('submitBusy') : T('submit');
  }

  function persist() {
    try {
      var keep = $('remember').checked;
      if (keep) localStorage.setItem(LS_KEY, state.key);
      else localStorage.removeItem(LS_KEY);
      /* Токен доступа — такой же секрет, как ключ, и живёт по той же галочке. */
      if (keep && state.token) localStorage.setItem(LS_TOK, state.token);
      else localStorage.removeItem(LS_TOK);
      localStorage.setItem(LS_BASE, state.base);
      localStorage.setItem(LS_GRANT, String(state.grant));
      if (state.grantManual) localStorage.setItem(LS_GRANT_SET, '1');
      else localStorage.removeItem(LS_GRANT_SET);
      if (state.proxy) localStorage.setItem(LS_PROXY, state.proxy); else localStorage.removeItem(LS_PROXY);
    } catch (e) { /* приватный режим — просто не сохраняем */ }
    $('forget').classList.toggle('hidden', !$('remember').checked);
  }

  /* ---------- отрисовка ---------- */
  function renderAll() { renderBalance(); renderChart(); renderTable(); }

  /* ---------- инструкции ---------- */
  var guideId = '';
  /* Какая инструкция открыта при первом заходе. Claude App спрашивают чаще всего,
     поэтому раздел открывается сразу на ней, а не на первой карточке списка. */
  var GUIDE_DEFAULT = 'claude-app';

  function tools() {
    var all = [];
    guides().groups.forEach(function (g) { g.tools.forEach(function (t) { all.push(t); }); });
    return all;
  }

  /* Ключ подставляется прямо в команды: так его не приходится вставлять руками в каждую строку.
     Пока ключа нет, стоит заметная заглушка, чтобы человек видел, куда его вписать. */
  function keyForGuide() {
    return state.key || ($('key').value || '').trim() || T('keyStub');
  }
  function sub(text) { return String(text).split('{{KEY}}').join(keyForGuide()); }

  /* Крошечная разметка в текстах шагов: **жирный** и `моноширинный`.
     Экранируем до подстановки тегов — иначе данные могли бы принести чужой HTML. */
  function md(text) {
    return esc(sub(text))
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function renderPicker() {
    var html = '';
    guides().groups.forEach(function (g) {
      html += '<div class="pgroup"><div class="pgroup__t">' + esc(g.title) + '</div><div class="chips">';
      g.tools.forEach(function (t) {
        html += '<button type="button" class="chip' + (t.id === guideId ? ' is-on' : '') + '"' +
          ' data-tool="' + esc(t.id) + '" aria-pressed="' + (t.id === guideId) + '">' + esc(t.name) + '</button>';
      });
      html += '</div></div>';
    });
    $('picker').innerHTML = html;
  }

  function showGuide(id) {
    var list = tools(), t = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) t = list[i];
    if (!t) return;
    guideId = t.id;
    renderPicker();

    var h = '<h3 class="guide__name">' + esc(t.name) +
      (t.note ? ' <span>' + esc(t.note) + '</span>' : '') + '</h3>';

    var mine = state.key || ($('key').value || '').trim();
    if (mine) h += '<p class="guide__hint">' + esc(T('guideMine')) + '</p>';

    h += '<div class="ways">' + t.ways.map(function (w) {
      return '<div class="way"><span class="way__proto">' + esc(w.proto) + '</span>' +
        '<span class="way__base">' + esc(w.base) + '</span>' +
        '<span class="way__models">' + esc(w.models) + '</span></div>';
    }).join('') + '</div>';

    h += '<ol class="gsteps">' + t.steps.map(function (s) { return '<li>' + md(s) + '</li>'; }).join('') + '</ol>';

    t.code.forEach(function (c, i) {
      h += '<div class="snip"><div class="snip__head"><span>' + esc(c.title) + '</span>' +
        '<button type="button" class="copy" data-i="' + i + '">' + esc(T('copy')) + '</button></div>' +
        '<pre><code>' + esc(sub(c.text)) + '</code></pre></div>';
    });

    h += t.notes.map(function (n) { return '<div class="gnote">' + md(n) + '</div>'; }).join('');

    $('guide').innerHTML = h;
  }

  /* Ключ мог появиться или пропасть уже после отрисовки — обновляем открытую инструкцию. */
  function refreshGuide() { if (guideId) showGuide(guideId); }

  function copySnippet(btn) {
    var list = tools(), t = null, i = Number(btn.dataset.i);
    for (var k = 0; k < list.length; k++) if (list[k].id === guideId) t = list[k];
    if (!t || !t.code[i]) return;
    var text = sub(t.code[i].text);
    var done = function () {
      btn.textContent = T('copied');
      btn.classList.add('is-done');
      setTimeout(function () { btn.textContent = T('copy'); btn.classList.remove('is-done'); }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { copyFallback(text, done); });
    } else copyFallback(text, done);
  }
  /* Без https буфер обмена браузеру недоступен, поэтому оставлен старый способ через скрытое поле. */
  function copyFallback(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('style', 'position:fixed;left:-9999px;top:0');
    document.body.appendChild(ta);
    try { ta.select(); document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  }

  function resetView() {
    state.billing = null; state.account = null; state.logs = []; state.spend = []; state.logsTotal = null;
    $('remain').textContent = '$—';
    $('remain').className = 'gauge__num is-idle';
    $('remainOf').textContent = T('gaugeIdle');
    $('grantRow').classList.add('hidden');
    $('grantNote').textContent = '';
    drawSegs(0, false);
    ['s24', 's7', 'sreq', 'sfc', 'pSum', 'pReq', 'pAvg', 'pPeak'].forEach(function (id) { $(id).textContent = '—'; });
    $('bars').innerHTML = ''; $('rows').innerHTML = '';
    $('tblEmpty').classList.remove('hidden');
    $('tblMore').classList.add('hidden');
    $('tznote').textContent = '';
    $('updated').textContent = '';
  }

  var SEG_COUNT = 48;
  function drawSegs(pct, animate) {
    var on = Math.round(Math.max(0, Math.min(1, pct)) * SEG_COUNT);
    var low = pct < 0.1;
    var html = '';
    for (var i = 0; i < SEG_COUNT; i++) {
      var cls = 'seg' + (i < on ? ' on' + (low ? ' low' : '') + (animate ? ' fill' : '') : '');
      html += '<div class="' + cls + '" style="--i:' + i + '"></div>';
    }
    $('segs').innerHTML = html;
    $('segs').setAttribute('aria-label', T('meterAriaVal', Math.round(pct * 100)));
  }

  function renderBalance() {
    var b = state.billing, acc = state.account, now = Date.now();
    var typing = document.activeElement === $('grant');
    var spentByKey = b ? b.spent : C.sum(state.spend);

    /* Пока в поле печатают, верим набранному: иначе цифра будет прыгать под руками. */
    var g = C.resolveGrant({
      limit: b ? b.limit : null,
      account: acc,
      manual: state.grant,
      manualSet: state.grantManual,
      trustManual: typing,
      spent: acc ? acc.spent : spentByKey
    });

    var grant = g.value;
    var spent = g.source === 'account' ? acc.spent : spentByKey;
    var remain = g.source === 'account' ? acc.remain : grant - spent;
    var guessed = g.source === 'auto' || g.source === 'outgrown';

    /* Поле всегда показывает ту сумму, от которой считается остаток. */
    state.grant = grant;
    /* Вписанное устарело — снимаем ручной режим и запоминаем поправку, иначе после
       перезагрузки страница снова покажет ту же неверную цифру. */
    if (g.source === 'outgrown') { state.grantManual = false; persist(); }
    if (!typing) $('grant').value = Math.round(grant * 100) / 100;

    $('grantRow').classList.toggle('hidden', g.source === 'limit' || !(b || acc));
    $('grantNote').innerHTML = grantNote(g);
    $('tokDrop').classList.toggle('hidden', !state.token);

    if ((b || acc) && grant > 0) {
      var pct = Math.max(0, remain) / grant;
      $('remain').textContent = C.usdSmart(remain);
      $('remain').className = 'gauge__num' + (pct < 0.1 ? ' is-low' : '');
      var parts = [T(g.source === 'limit' ? 'ofLimit' : 'ofGrant') + (guessed ? '≈' : '') + '<b>' + C.usd(grant) + '</b>',
                   T('ofSpent', C.usd(spent)),
                   T('ofLeft', Math.round(pct * 100))];
      if (b && b.accessUntil > 0) parts.push(T('ofUntil', fmtDate(b.accessUntil)));
      $('remainOf').innerHTML = parts.join(' · ');
      drawSegs(pct, true);
    } else {
      $('remain').textContent = C.usdSmart(C.sum(state.spend));
      $('remain').className = 'gauge__num is-idle';
      $('remainOf').textContent = T('ofNoBalance');
      drawSegs(0, false);
    }

    var d24 = C.sum(C.since(state.spend, now - 86400000, now));
    var d7 = C.sum(C.since(state.spend, now - 7 * 86400000, now));
    $('s24').textContent = C.usdSmart(d24);
    $('s7').textContent = C.usdSmart(d7);
    $('sreq').innerHTML = num(state.spend.length) +
      (state.spend.length ? '<small>' + T('firstReq', fmtDate(state.spend[state.spend.length - 1].ts)) + '</small>' : '');

    var f = b && remain > 0 ? C.forecast(state.spend, remain, now) : { days: null, perDay: 0 };
    if (f.days == null) {
      $('sfc').innerHTML = '—<small>' + T(b && remain > 0 ? 'fcNoWeek' : 'fcNeed') + '</small>';
    } else if (f.days > 365) {
      $('sfc').innerHTML = T('fcYear') + '<small>' + T('perDay', C.usdSmart(f.perDay)) + '</small>';
    } else {
      var d = Math.floor(f.days);
      $('sfc').innerHTML = TP('days', d) +
        '<small>' + T('fcUntil', C.usdSmart(f.perDay), fmtDate(f.until.getTime(), true)) + '</small>';
    }

    var models = C.modelTotals(state.spend);
    var pick = $('modelPick'), prev = state.model;
    pick.innerHTML = '<option value="all">' + esc(T('allModels')) + '</option>' + models.map(function (m) {
      return '<option value="' + esc(m.model) + '">' + esc(m.model) + ' — ' + C.usdSmart(m.usd) + '</option>';
    }).join('');
    pick.value = models.some(function (m) { return m.model === prev; }) ? prev : 'all';
    state.model = pick.value;

    $('updated').textContent = T('updated', new Date().toLocaleTimeString(L()._locale, { hour: '2-digit', minute: '2-digit' }));
  }

  /* Человек должен видеть, откуда взялась сумма выдачи, а не только саму цифру. */
  function grantNote(g) {
    if (g.source === 'account') return T('grantAccount');
    if (g.source === 'manual') return T('grantManual');
    if (g.source === 'outgrown') return T('grantOutgrown', C.usd(g.manual), C.usd(g.value));
    return T('grantGuess');
  }

  function filtered() {
    return state.model === 'all' ? state.spend : state.spend.filter(function (l) { return l.model === state.model; });
  }

  function renderChart() {
    var bounds = C.rangeBounds(state.range, state.spend, state.custom, Date.now());
    var logs = filtered();
    var buckets = C.bucketize(logs, bounds[0], bounds[1], state.gran);
    var max = 0, sum = 0, req = 0, peak = null;
    buckets.forEach(function (b) {
      if (b.usd > max) { max = b.usd; peak = b; }
      sum += b.usd; req += b.count;
    });

    var scale = max > 0 ? max : 1;
    $('bars').innerHTML = buckets.map(function (b) {
      var h = b.usd > 0 ? Math.max(2, (b.usd / scale) * 100) : 0;
      return '<div class="bar' + (b.usd > 0 ? '' : ' zero') + (peak && b.t === peak.t && b.usd > 0 ? ' peak' : '') +
        '" data-t="' + b.t + '" data-usd="' + b.usd + '" data-c="' + b.count + '">' +
        '<i style="height:' + h.toFixed(2) + '%"></i></div>';
    }).join('');

    $('grid').querySelectorAll('.gridline').forEach(function (n) { n.remove(); });
    [1, 0.5].forEach(function (frac) {
      var el = document.createElement('div');
      el.className = 'gridline';
      el.style.top = ((1 - frac) * 100) + '%';
      el.innerHTML = '<span>' + C.usdSmart(scale * frac) + '</span>';
      $('grid').appendChild(el);
    });

    $('xa').textContent = buckets.length ? fmtBucket(buckets[0].t, state.gran, true) : '';
    $('xb').textContent = buckets.length ? fmtBucket(buckets[buckets.length - 1].t, state.gran, true) : '';

    $('pSum').textContent = C.usdSmart(sum);
    $('pReq').textContent = num(req);
    $('pAvg').textContent = req ? C.usdSmart(sum / req) : '—';
    $('pPeak').innerHTML = peak && peak.usd > 0
      ? C.usdSmart(peak.usd) + '<small>' + fmtBucket(peak.t, state.gran) + '</small>'
      : '—';

    $('tznote').innerHTML = state.spend.length
      ? T('tzNote', tzLabel()) +
        (state.logsTotal != null ? T('tzLoaded', num(state.logs.length), num(state.logsTotal)) : '')
      : '';
  }

  function tzLabel() {
    var off = -new Date().getTimezoneOffset(), sign = off < 0 ? '−' : '+';
    var h = Math.floor(Math.abs(off) / 60), m = Math.abs(off) % 60;
    var utc = 'UTC' + sign + h + (m ? ':' + (m < 10 ? '0' + m : m) : '');
    var name = '';
    try { name = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    return name ? name + ' (' + utc + ')' : utc;
  }

  function renderTable() {
    var logs = filtered().slice(0, 100);
    if (!logs.length) {
      $('rows').innerHTML = '';
      $('tblEmpty').textContent = state.spend.length
        ? T('emptyModel')
        : T('emptyAll');
      $('tblEmpty').classList.remove('hidden');
      $('tblMore').classList.add('hidden');
      return;
    }
    $('tblEmpty').classList.add('hidden');
    $('rows').innerHTML = logs.map(function (l) {
      return '<tr><td class="time">' + fmtDate(l.ts, false, true) + '</td>' +
        '<td class="model">' + esc(l.model) + '</td>' +
        '<td class="num">' + num(l.pt) + '</td>' +
        '<td class="num">' + num(l.ct) + '</td>' +
        '<td class="num">' + (l.useTime ? l.useTime + ' ' + T('secShort') : '—') + '</td>' +
        '<td class="num">' + C.usdSmart(l.usd) + '</td></tr>';
    }).join('');
    var total = filtered().length;
    $('tblMore').classList.toggle('hidden', total <= 100);
    $('tblMore').textContent = T('tblMore', num(total));
  }

  /* ---------- форматирование ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(ts, dateOnly, withSec) {
    var o = { day: 'numeric', month: 'short' };
    var d = new Date(ts);
    if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    if (!dateOnly) { o.hour = '2-digit'; o.minute = '2-digit'; if (withSec) o.second = '2-digit'; }
    return d.toLocaleString(L()._locale, o);
  }
  function fmtBucket(ts, gran, short) {
    var d = new Date(ts);
    if (gran === 'hour') {
      return d.toLocaleString(L()._locale, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString(L()._locale, short ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'long' });
  }

  /* ---------- подсказка на графике ---------- */
  var tip = null;
  function showTip(bar) {
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; $('grid').parentNode.appendChild(tip); }
    var usd = Number(bar.dataset.usd), c = Number(bar.dataset.c), t = Number(bar.dataset.t);
    tip.innerHTML = '<b>' + C.usdSmart(usd) + '</b> · ' + TP('reqs', c) +
      '<em>' + fmtBucket(t, state.gran) + '</em>';
    var wrapBox = $('grid').parentNode.getBoundingClientRect(), b = bar.getBoundingClientRect();
    tip.style.left = (b.left - wrapBox.left + b.width / 2) + 'px';
    tip.style.top = (b.top - wrapBox.top - 8) + 'px';
    tip.style.display = 'block';
  }
  function hideTip() { if (tip) tip.style.display = 'none'; }

  /* ---------- события ---------- */
  $('form').addEventListener('submit', function (e) { e.preventDefault(); check(); });

  $('reveal').addEventListener('click', function () {
    var i = $('key'), show = i.type === 'password';
    i.type = show ? 'text' : 'password';
    this.textContent = T(show ? 'hide' : 'reveal');
    this.setAttribute('aria-label', T(show ? 'hideAria' : 'revealAria'));
  });

  $('remember').addEventListener('change', function () {
    if (state.key || $('key').value) persist();
    $('forget').classList.toggle('hidden', !this.checked);
  });

  $('forget').addEventListener('click', function () {
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_TOK); } catch (e) {}
    $('key').value = ''; state.key = '';
    $('tok').value = ''; state.token = '';
    $('tokDrop').classList.add('hidden');
    $('remember').checked = false;
    this.classList.add('hidden');
    resetView();
    hide('err'); hide('warn');
    refreshGuide();
    $('key').focus();
  });

  $('base').addEventListener('change', function () { state.base = this.value; persist(); if (state.key) check(); });
  $('proxy').addEventListener('change', function () { state.proxy = this.value.trim(); persist(); });

  /* Сумму выдачи правят руками — пересчитываем остаток, не дёргая сеть. */
  $('grant').addEventListener('input', function () {
    var v = Number(this.value);
    state.grant = isFinite(v) && v > 0 ? v : C.DEFAULT_GRANT;
    state.grantManual = true;          /* дальше эта сумма важнее оценки */
    persist();
    renderBalance();
  });

  $('tokApply').addEventListener('click', applyToken);
  $('tok').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); applyToken(); } });

  function applyToken() {
    state.token = $('tok').value.trim();
    $('tokDrop').classList.toggle('hidden', !state.token);
    persist();
    if (state.key && !state.loading) check(); else renderBalance();
  }

  $('tokDrop').addEventListener('click', function () {
    state.token = ''; $('tok').value = '';
    state.account = null;
    this.classList.add('hidden');
    persist();
    renderBalance();
  });

  /* Окно выбора языка закрывается только выбором — по-другому его закрыть нельзя,
     иначе страница осталась бы под затемнением. */
  $('langGate').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-lang]') : null;
    if (!b) return;
    applyLang(b.dataset.lang);
    $('langGate').classList.add('hidden');
    $('key').focus();
  });

  $('langCtl').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || b.dataset.lang === lang) return;
    applyLang(b.dataset.lang);
  });

  $('picker').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    showGuide(b.dataset.tool);
  });

  $('guide').addEventListener('click', function (e) {
    var b = e.target.closest('.copy'); if (!b) return;
    copySnippet(b);
  });

  $('granCtl').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.gran = b.dataset.gran;
    press('granCtl', 'gran', state.gran);
    renderChart();
  });

  $('rangeCtl').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.range = b.dataset.range;
    press('rangeCtl', 'range', state.range);
    $('customRow').classList.toggle('hidden', state.range !== 'custom');
    /* Час имеет смысл на коротком окне; на длинном сам переключаемся на дни. */
    if (state.range === '24h' && state.gran !== 'hour') { state.gran = 'hour'; press('granCtl', 'gran', 'hour'); }
    if ((state.range === '30d' || state.range === 'all') && state.gran === 'hour') { state.gran = 'day'; press('granCtl', 'gran', 'day'); }
    renderChart();
  });

  function press(ctl, attr, val) {
    Array.prototype.forEach.call($(ctl).children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset[attr] === val));
    });
  }

  ['from', 'to'].forEach(function (id) {
    $(id).addEventListener('change', function () {
      state.custom[id] = this.value;
      if (state.range !== 'custom') { state.range = 'custom'; press('rangeCtl', 'range', 'custom'); $('customRow').classList.remove('hidden'); }
      renderChart();
    });
  });

  $('modelPick').addEventListener('change', function () { state.model = this.value; renderChart(); renderTable(); });

  $('bars').addEventListener('mouseover', function (e) { var b = e.target.closest('.bar'); if (b) showTip(b); });
  $('bars').addEventListener('mouseleave', hideTip);
  $('bars').addEventListener('scroll', hideTip);

  function showErr(html) { $('err').innerHTML = html; $('err').classList.remove('hidden'); }
  function showWarn(html) { $('warn').innerHTML = html; $('warn').classList.remove('hidden'); }
  function hide(id) { $(id).classList.add('hidden'); }

  /* ---------- старт ---------- */
  (function init() {
    drawSegs(0, false);

    /* Язык применяем первым: он заполняет разметку и заодно рисует раздел инструкций,
       который живёт отдельно от баланса и должен работать без ключа. */
    applyLang(LANG_DEFAULT);
    $('gateRu').focus();     /* окно выбора языка открыто — курсор сразу в нём */

    var d = new Date(), pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    var iso = function (x) { return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); };
    $('to').value = iso(d);
    $('from').value = iso(new Date(Date.now() - 6 * 86400000));
    state.custom = { from: $('from').value, to: $('to').value };

    try {
      var savedBase = localStorage.getItem(LS_BASE);
      if (savedBase) { state.base = savedBase; $('base').value = savedBase; }
      var savedProxy = localStorage.getItem(LS_PROXY);
      if (savedProxy) { state.proxy = savedProxy; $('proxy').value = savedProxy; }
      var savedGrant = Number(localStorage.getItem(LS_GRANT));
      if (isFinite(savedGrant) && savedGrant > 0) state.grant = savedGrant;
      state.grantManual = !!localStorage.getItem(LS_GRANT_SET);
      $('grant').value = state.grant;
      var savedTok = localStorage.getItem(LS_TOK);
      if (savedTok) { state.token = savedTok; $('tok').value = savedTok; $('tokDrop').classList.remove('hidden'); }
      var savedKey = localStorage.getItem(LS_KEY);
      if (savedKey) {
        $('key').value = savedKey;
        $('remember').checked = true;
        $('forget').classList.remove('hidden');
        refreshGuide();     /* ключ уже есть — сразу подставляем его в команды */
        check();
      }
    } catch (e) { /* localStorage недоступен — работаем без сохранения */ }
  })();
})();
</script>
</body>
</html>
